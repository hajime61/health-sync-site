<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<title>Health Dashboard</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --fg:#14171c; --muted:#6b7280; --line:#e4e7eb;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --accent:#2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --fg:#e8eaed; --muted:#9aa2ad; --line:#272b33; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-size:15px; line-height:1.6;
         font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .wrap { max-width:620px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  h1 { font-size:1.05rem; margin:0; }
  h1 .t { font-size:.72rem; font-weight:400; color:var(--muted); margin-left:6px; }
  .sub { color:var(--muted); font-size:.8rem; }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .chead { display:flex; align-items:flex-start; justify-content:space-between; gap:4px; }
  .card h2 { font-size:.78rem; margin:0 0 6px; color:var(--muted); font-weight:600; }
  .val { font-size:1.5rem; font-weight:650; letter-spacing:-.02em; }
  .val .u { font-size:.78rem; font-weight:400; color:var(--muted); margin-left:2px; }
  .row { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .tag { font-size:.7rem; padding:1px 7px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .tag.ok{color:var(--ok);border-color:currentColor}
  .tag.low,.tag.high,.tag.below{color:var(--warn);border-color:currentColor}
  .tag.strong{color:var(--bad);border-color:currentColor}

  /* 目安と平均の実数 */
  .meta { margin:8px 0 0; padding:7px 0 0; border-top:1px solid var(--line);
          display:grid; gap:2px; font-size:.74rem; }
  .meta div { display:flex; gap:6px; align-items:baseline; }
  .meta dt { color:var(--muted); width:2.4em; flex:none; margin:0; }
  .meta dd { margin:0; font-variant-numeric:tabular-nums; }
  .meta em { font-style:normal; color:var(--muted); margin-left:4px; }

  svg.spark { display:block; width:100%; height:28px; margin-top:8px; }

  .signal { margin-top:12px; padding:13px 15px; border-radius:12px;
            border:1px solid var(--bad); background:color-mix(in srgb,var(--bad) 8%,transparent); }
  .signal h2 { margin:0 0 4px; font-size:.95rem; color:var(--bad); }
  .signal p { margin:0; font-size:.85rem; }

  .note { margin-top:18px; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
          color:var(--muted); font-size:.75rem; }
  button { font:inherit; padding:8px 14px; border-radius:9px; border:1px solid var(--line);
           background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.sm { padding:3px 9px; font-size:.8rem; }
  input { font:inherit; width:100%; padding:9px 11px; border-radius:9px;
          border:1px solid var(--line); background:var(--card); color:var(--fg); margin-top:5px; }
  label { display:block; margin-top:12px; font-size:.82rem; color:var(--muted); }
  .hide { display:none !important; }
  .actions { display:flex; gap:8px; align-items:center; margin-top:16px; flex-wrap:wrap; }

  /* 並び替えモード */
  .ord { display:none; gap:3px; flex:none; }
  .ord button { padding:0; width:26px; height:26px; line-height:1; border-radius:7px; font-size:.85rem; }
  .ord button[disabled] { opacity:.3; }
  body.editing .ord { display:flex; }
  body.editing .card { border-color:var(--accent); }
  body.editing .meta, body.editing svg.spark, body.editing .row { opacity:.35; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 初回設定 -->
  <section id="setup" class="hide">
    <h1>接続設定</h1>
    <p class="sub">Apps Script のウェブアプリURLとトークンを入力します。端末内にのみ保存されます。</p>
    <label>ウェブアプリURL<input id="f-url" placeholder="https://script.google.com/macros/s/.../exec"></label>
    <label>トークン<input id="f-token" placeholder="generateToken() で作った文字列"></label>
    <div class="actions"><button class="primary" id="save">接続する</button><span id="err" class="sub"></span></div>
  </section>

  <!-- 本体 -->
  <section id="app" class="hide">
    <header>
      <h1 id="asof">健康データ</h1>
      <span class="sub" id="status"></span>
    </header>

    <div id="signal"></div>
    <div class="grid" id="cards"></div>

    <div class="bar">
      <span class="sub" id="hint"></span>
      <button class="sm" id="edit">並び替え</button>
    </div>

    <div class="note">
      「目安」は一般的な参考値であり、診断ではありません。
      数値はウェアラブル端末による推定値で、医療機器の測定とは異なります。
      気になる状態が続く場合は医療機関にご相談ください。
    </div>

    <div class="actions">
      <button id="sync">再同期</button>
      <button id="refetch">全件取り直す</button>
      <button id="reset">接続設定を消す</button>
    </div>
  </section>

</div>

<script src="stats.js"></script>
<script>
// ── 保存 ──────────────────────────────────────────────────────
const LS = {
  get url()   { return localStorage.getItem('hd.url'); },
  get token() { return localStorage.getItem('hd.token'); },
  get data()  { try { return JSON.parse(localStorage.getItem('hd.data')); } catch (e) { return null; } },
  get order() { try { return JSON.parse(localStorage.getItem('hd.order')); } catch (e) { return null; } },
  set(k, v)   { localStorage.setItem('hd.' + k, typeof v === 'string' ? v : JSON.stringify(v)); },
  clear()     { ['url','token','data','order'].forEach(k => localStorage.removeItem('hd.' + k)); },
};

// 既定の並び順
const DEFAULT_ORDER = ['sleep_total_min','resting_hr','hrv_ms','spo2_avg','resp_rate',
                       'steps','active_minutes','skin_temp_delta','sedentary_min','sleep_deep_min'];

/** 保存済みの並びに、新しく増えた項目を後ろへ足して返す */
function order() {
  const saved = LS.order || [];
  const known = saved.filter(c => DEFAULT_ORDER.includes(c));
  return known.concat(DEFAULT_ORDER.filter(c => !known.includes(c)));
}

const $ = id => document.getElementById(id);
let editing = false;

// ── 表示の整形 ────────────────────────────────────────────────
const TIME_COLS = ['sleep_total_min','sleep_deep_min','sedentary_min'];

/** 値と、その横に出す単位を返す（単位を文に含める場合は unit を空にする） */
function fmt(col, v, unit) {
  if (v === null || v === undefined) return { text: '—', unit: '' };

  if (TIME_COLS.includes(col)) {
    const h = Math.floor(v / 60), m = Math.round(v % 60);
    return { text: h ? h + '時間' + (m ? m + '分' : '') : m + '分', unit: '' };
  }
  if (col === 'steps' || col === 'workout_steps') {
    return { text: Math.round(v).toLocaleString(), unit: unit };
  }
  if (typeof v === 'number') return { text: String(Math.round(v * 10) / 10), unit: unit };
  return { text: String(v), unit: unit };
}

/** 目安を実数で表す。baselineOnly と未定義は null */
function rangeText(col, ranges, unit) {
  const r = (ranges || {})[col];
  if (!r || r.baselineOnly) return null;
  const n = v => fmt(col, v, '').text;

  if (r.goal !== undefined) return n(r.goal) + ' 以上';
  if (r.min !== undefined && r.max !== undefined) return n(r.min) + '〜' + n(r.max);
  if (r.min !== undefined) return n(r.min) + ' 以上';
  if (r.max !== undefined) return n(r.max) + ' 以下';
  return null;
}

/** 平均との差を符号付きで表す */
function deltaText(col, diff) {
  if (diff === null) return '';
  const a = Math.abs(diff);
  const n = TIME_COLS.includes(col) ? Math.round(a)
          : col === 'steps'         ? Math.round(a)
          :                           Math.round(a * 10) / 10;
  const suffix = TIME_COLS.includes(col) ? '分' : '';
  if (n === 0) return '±0' + suffix;                       // 「−0分」を避ける
  return (diff >= 0 ? '+' : '−') + n.toLocaleString() + suffix;
}

/** ISO文字列を JST の HH:mm にする */
function jstTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const j = new Date(d.getTime() + 9 * 3600 * 1000);
  return String(j.getUTCHours()).padStart(2, '0') + ':' +
         String(j.getUTCMinutes()).padStart(2, '0');
}

/** 直近30日のスパークライン */
function spark(points) {
  if (points.length < 2) return '';
  const vs = points.map(p => p.value);
  const lo = Math.min(...vs), hi = Math.max(...vs), span = (hi - lo) || 1;
  const W = 100, H = 28, pad = 3;
  const d = points.map((p, i) => {
    const x = (i / (points.length - 1)) * W;
    const y = H - pad - ((p.value - lo) / span) * (H - pad * 2);
    return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }).join(' ');
  const ly = H - pad - ((vs[vs.length - 1] - lo) / span) * (H - pad * 2);
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
         '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="1.5"' +
         ' vector-effect="non-scaling-stroke"/>' +
         '<circle cx="' + W + '" cy="' + ly.toFixed(1) + '" r="2" fill="var(--accent)"/></svg>';
}

// ── 描画 ──────────────────────────────────────────────────────
function render(payload) {
  if (!payload.rows.length) { $('status').textContent = 'データがありません'; return; }

  // 同期は毎朝5時。当日は数時間分しか無いので既定は昨日を見る
  const date = Stats.targetDate(payload, Stats.todayJST());
  if (!date) { $('status').textContent = 'データがありません'; return; }
  const row = Stats.rowOf(payload, date);

  const today = Stats.todayJST();
  const d  = new Date(date + 'T00:00:00Z');
  const wd = ['日','月','火','水','木','金','土'][d.getUTCDay()];
  // その行を最後に同期した時刻。データの鮮度が分かる
  const upd = jstTime(Stats.valueOf(payload, row, 'updated_at'));
  $('asof').innerHTML = (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日（' + wd + '）' +
                        (date === today ? ' 今日' : '') +
                        (upd ? '<span class="t">' + upd + ' 更新</span>' : '');
  $('hint').textContent = payload.rows.length + '日分 ・ 目安と平均は直近30日で算出';

  // 体調の前触れ
  const sig = Stats.illnessSignal(payload, date, 30);
  $('signal').innerHTML = sig.triggered
    ? '<div class="signal"><h2>体調を崩す前触れかもしれません</h2>' +
      '<p>安静時心拍・呼吸数・皮膚温がそろって普段より高くなっています。' +
      '無理をせず休養を取ることをおすすめします。</p></div>'
    : '';

  const cols = order();
  $('cards').innerHTML = cols.map((col, i) => {
    const label = payload.labels[col] || col;
    const unit  = payload.units[col] || '';
    const v     = Stats.valueOf(payload, row, col);
    const f     = fmt(col, v, unit);

    // 当日の累積指標はまだ増える途中。全日の平均や目安と比べると
    // 朝は必ず「低い」と出てしまうため、判定自体を出さない
    const partial = Stats.isPartial(col, date, today);
    const base = Stats.baseline(payload, col, date, 30);

    const tags = [];
    if (partial) {
      tags.push('<span class="tag">進行中</span>');
    } else {
      const rng = Stats.inRange(col, v, payload.ranges);
      const z   = Stats.zscore(v, base);
      const j   = Stats.judge(z);
      if (rng) tags.push('<span class="tag ' + rng.status + '">' + rng.label + '</span>');
      if (z !== null) {
        const cls = j.level === 'strong' ? 'strong' : j.level === 'slight' ? 'low' : 'ok';
        tags.push('<span class="tag ' + cls + '">' + j.label + '</span>');
      } else if (v !== null) {
        tags.push('<span class="tag">比較するデータが不足</span>');
      }
    }

    // 目安と平均を実数で出す
    const meta = [];
    const rt = rangeText(col, payload.ranges, unit);
    // 一般的な基準範囲が無い指標も行自体は出す。カードの高さが揃い、
    // 「なぜ目安が無いのか」も伝わる
    meta.push('<div><dt>目安</dt><dd>' +
      (rt || '<em style="margin:0">個人差が大きく設定なし</em>') + '</dd></div>');
    if (partial) {
      // 平均比の代わりに昨日の最終値を出す。進み具合の目安になる
      const prev = Stats.rowOf(payload, Stats.shiftDate(date, -1));
      const pv   = prev ? Stats.valueOf(payload, prev, col) : null;
      meta.push('<div><dt>昨日</dt><dd>' + fmt(col, pv, '').text + '</dd></div>');
    } else if (base.mean !== null) {
      const diff = (typeof v === 'number') ? v - base.mean : null;
      meta.push('<div><dt>平均</dt><dd>' + fmt(col, base.mean, '').text +
                (diff === null ? '' : '<em>' + deltaText(col, diff) + '</em>') + '</dd></div>');
    } else {
      meta.push('<div><dt>平均</dt><dd>—<em>' + base.n + '日分のみ</em></dd></div>');
    }

    return '<div class="card" data-col="' + col + '">' +
           '<div class="chead"><h2>' + label + '</h2>' +
           '<span class="ord">' +
             '<button data-d="-1"' + (i === 0 ? ' disabled' : '') + ' aria-label="上へ">↑</button>' +
             '<button data-d="1"' + (i === cols.length - 1 ? ' disabled' : '') + ' aria-label="下へ">↓</button>' +
           '</span></div>' +
           '<div class="val">' + f.text + '<span class="u">' + f.unit + '</span></div>' +
           '<div class="row">' + tags.join('') + '</div>' +
           '<dl class="meta">' + meta.join('') + '</dl>' +
           spark(Stats.series(payload, col).slice(-30)) + '</div>';
  }).join('');
}

// ── 並び替え ──────────────────────────────────────────────────
$('cards').addEventListener('click', e => {
  const btn = e.target.closest('.ord button');
  if (!btn || !editing) return;

  const col  = btn.closest('.card').dataset.col;
  const list = order();
  const i    = list.indexOf(col);
  const j    = i + Number(btn.dataset.d);
  if (i < 0 || j < 0 || j >= list.length) return;

  [list[i], list[j]] = [list[j], list[i]];
  LS.set('order', list);
  render(LS.data);
});

$('edit').onclick = () => {
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  $('edit').textContent = editing ? '完了' : '並び替え';
  $('hint').textContent = editing ? '↑↓ で順番を入れ替えます' : '目安と平均は直近30日で算出';
};

// ── 取得 ──────────────────────────────────────────────────────
async function fetchData(from) {
  const url = LS.url + (LS.url.includes('?') ? '&' : '?') +
              'token=' + encodeURIComponent(LS.token) + (from ? '&from=' + from : '');
  const res = await fetch(url, { redirect: 'follow' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  if (j.error) throw new Error(j.error);
  return j;
}

/** 手元のデータに差分を統合する（同じ日付は新しい方で置き換え） */
function merge(oldP, newP) {
  if (!oldP || !oldP.rows) return newP;
  const di = newP.columns.indexOf('date');

  // 列構成が変わっても手元の履歴を捨てない。列名で並べ替えてから統合する
  const oldRows = (oldP.columns.join() === newP.columns.join())
    ? oldP.rows
    : Stats.remapRows(oldP.columns, newP.columns, oldP.rows);

  const map = new Map(oldRows.map(r => [r[di], r]));
  newP.rows.forEach(r => map.set(r[di], r));
  return Object.assign({}, newP,
    { rows: [...map.values()].sort((a, b) => (a[di] < b[di] ? -1 : 1)) });
}

/** 手元のデータを捨てて全期間を取り直す（接続設定は保持する） */
async function refetchAll() {
  if (!confirm('保存済みのデータを消して、全期間を取り直します。よろしいですか？')) return;
  localStorage.removeItem('hd.data');
  $('status').textContent = '全件取得中…';
  try {
    const fresh = await fetchData('');
    LS.set('data', fresh);
    render(fresh);
  } catch (e) {
    $('status').textContent = '取得できません（' + e.message + '）';
  }
}

async function sync() {
  const cached = LS.data;
  $('status').textContent = '同期中…';
  try {
    const di = cached ? cached.columns.indexOf('date') : 0;
    const from = cached && cached.rows.length
      ? Stats.shiftDate(cached.rows[cached.rows.length - 1][di], -7)   // 書き換わるので少し重ねる
      : '';
    const fresh = merge(cached, await fetchData(from));
    LS.set('data', fresh);
    render(fresh);
  } catch (e) {
    if (cached) { render(cached); $('status').textContent = '保存済みのデータ'; }
    else { $('status').textContent = '同期できません（' + e.message + '）';
           $('setup').classList.remove('hide'); }
  }
}

// ── 起動 ──────────────────────────────────────────────────────
function boot() {
  if (!LS.url || !LS.token) { $('setup').classList.remove('hide'); return; }
  $('app').classList.remove('hide');
  if (LS.data) render(LS.data);   // まず手元のデータを即描画（オフラインでも見える）
  sync();
}

$('save').onclick = () => {
  const u = $('f-url').value.trim(), t = $('f-token').value.trim();
  if (!/^https:\/\/script\.google\.com\//.test(u)) { $('err').textContent = 'URLを確認してください'; return; }
  if (!t) { $('err').textContent = 'トークンを入力してください'; return; }
  LS.set('url', u); LS.set('token', t);
  $('setup').classList.add('hide'); $('app').classList.remove('hide');
  sync();
};
$('sync').onclick    = sync;
$('refetch').onclick = refetchAll;
$('reset').onclick = () => { LS.clear(); location.reload(); };

boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
